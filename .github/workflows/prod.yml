name: prod

on:
  push:
    tags:
      - '*.*.*'

concurrency: prod

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: install ssh key
        uses: shimataro/ssh-key-action@v2
        with:
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          known_hosts: '# known hosts'
      - name: add known hosts
        run: ssh-keyscan -H ${{ secrets.HOST }} >> ~/.ssh/known_hosts

      - name: checkout
        uses: actions/checkout@v7

      - name: nodejs
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'

      # see https://docs.github.com/en/actions/advanced-guides/caching-dependencies-to-speed-up-workflows
      - name: cache node modules
        uses: actions/cache@v6
        env:
          cache-name: cache-node-modules
        with:
          path: ~/.npm
          key: ${{ runner.os }}-build-${{ env.cache-name }}-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-build-${{ env.cache-name }}-
            ${{ runner.os }}-build-
            ${{ runner.os }}-

      - name: npm clean install
        run: npm ci

      - name: npm build
        env:
          WP_URL: ${{ vars.WP_URL }}
        run: |
          npm run nuxt:build

      - name: zip
        run: |
          7z a nuxt.zip .output/ ecosystem.config.cjs

      - name: copy
        run: |
          scp nuxt.zip ${{ secrets.USER }}@${{ secrets.HOST }}:${{ secrets.PATH_HOME }}

      - name: unzip and start the server
        run: |
          ssh ${{ secrets.USER }}@${{ secrets.HOST }} '
            set -e
            cd ${{ secrets.PATH_HOME }}
            rm -rf .output-temp/
            unzip -qq nuxt.zip -d .output-temp/
            rm -rf .output
            cp -rf .output-temp/.output .output
            cp -f .output-temp/ecosystem.config.cjs ecosystem.config.cjs
            pm2 startOrReload ecosystem.config.cjs -s --only cabral.ro
            pm2 save -s
          '
