name: prod

on:
  push:
    tags:
      - '*.*.*'

concurrency: prod

env:
  IMAGE: ghcr.io/zalog/cabral.ro

jobs:
  release:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: nodejs version
        id: node
        run: echo "version=$(cat .nvmrc)" >> "$GITHUB_OUTPUT"

      - name: set up buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: image metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          flavor: latest=false
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=prod

      - name: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          build-args: NODE_VERSION=${{ steps.node.outputs.version }}
          labels: ${{ steps.meta.outputs.labels }}
          tags: cabral.ro:test
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: smoke test
        id: smoke
        run: |
          docker run --detach --name app --read-only --publish 3000:3000 cabral.ro:test
          health() {
            docker exec app node -e "fetch('http://127.0.0.1:3000/favicon.ico').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"
          }
          for _ in $(seq 30); do
            health && break
            sleep 1
          done
          health
          test "$(docker exec app id -u)" != 0
          curl --fail --silent --show-error --output /dev/null http://localhost:3000/

      - name: smoke test logs
        if: failure() && steps.smoke.outcome == 'failure'
        run: docker logs app

      - name: log in to GHCR
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          build-args: NODE_VERSION=${{ steps.node.outputs.version }}
          labels: ${{ steps.meta.outputs.labels }}
          tags: ${{ steps.meta.outputs.tags }}
          push: true
          cache-from: type=gha

