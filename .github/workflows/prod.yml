name: prod

on:
  push:
    tags:
      - '*.*.*'

concurrency: prod

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: install ssh key
        uses: shimataro/ssh-key-action@87a8f067114a8ce263df83e9ed5c849953548bc3 # v2.8.1
        with:
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          known_hosts: '# known hosts'
      - name: add known hosts
        env:
          DEPLOY_HOST: ${{ secrets.HOST }}
        run: ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts

      - name: checkout
        uses: actions/checkout@v7

      - name: nodejs
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'

      # see https://docs.github.com/en/actions/advanced-guides/caching-dependencies-to-speed-up-workflows
      - name: cache node modules
        uses: actions/cache@v6
        env:
          cache-name: cache-node-modules
        with:
          path: ~/.npm
          key: ${{ runner.os }}-build-${{ env.cache-name }}-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-build-${{ env.cache-name }}-
            ${{ runner.os }}-build-
            ${{ runner.os }}-

      - name: npm clean install
        run: npm ci --ignore-scripts

      - name: npm build
        run: |
          npm run nuxt:build

      - name: zip
        run: |
          7z a nuxt.zip .output/ ecosystem.config.cjs

      - name: copy
        env:
          DEPLOY_USER: ${{ secrets.USER }}
          DEPLOY_HOST: ${{ secrets.HOST }}
          DEPLOY_PATH: ${{ secrets.PATH_HOME }}
        run: |
          scp nuxt.zip "$DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_PATH"

      - name: unzip and start the server
        env:
          DEPLOY_USER: ${{ secrets.USER }}
          DEPLOY_HOST: ${{ secrets.HOST }}
          DEPLOY_PATH: ${{ secrets.PATH_HOME }}
        run: |
          ssh "$DEPLOY_USER@$DEPLOY_HOST" "
            set -e
            cd $DEPLOY_PATH
            rm -rf .output-temp/
            unzip -qq nuxt.zip -d .output-temp/
            rm -rf .output
            cp -rf .output-temp/.output .output
            cp -f .output-temp/ecosystem.config.cjs ecosystem.config.cjs
            pm2 startOrReload ecosystem.config.cjs -s --only cabral.ro
            pm2 save -s
          "
